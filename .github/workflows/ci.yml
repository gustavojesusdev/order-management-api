name: CI

on:
  push:
    branches: [main, feat/week-8-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes (.NET 10 / LocalDB)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Iniciar SQL Server LocalDB
        run: |
          $localDb = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source
          if (-not $localDb) {
            $localDb = Get-ChildItem -Path "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $localDb) {
            throw 'SQL Server LocalDB nao encontrado na imagem do runner.'
          }

          & $localDb info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            & $localDb create MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel criar MSSQLLocalDB.' }
          }
          & $localDb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel iniciar MSSQLLocalDB.' }

      - name: Executar testes unitarios
        run: dotnet test tests/OrderManagementApi.Tests/OrderManagementApi.Tests.csproj --configuration Release --logger "trx;LogFileName=unitarios.trx" --results-directory TestResults/unitarios

      - name: Executar testes de integracao HTTP e SQL
        run: dotnet test tests/OrderManagementApi.IntegrationTests/OrderManagementApi.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=integracao.trx" --results-directory TestResults/integracao

      - name: Verificar publicacao da API
        run: dotnet publish OrderManagementApi.csproj --configuration Release --no-restore --output "${{ runner.temp }}/api-publish" /p:UseAppHost=false

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-dos-testes
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
