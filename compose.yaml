name: order-management-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-5211}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__OrderManagementApiDb: "Server=sqlserver,1433;Database=OrderManagementApiDockerDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Defina SQLSERVER_SA_PASSWORD no arquivo .env};Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      HttpsRedirection__Enabled: "false"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Defina SQLSERVER_SA_PASSWORD no arquivo .env}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sqlserver_data:
